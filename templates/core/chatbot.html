{% load django_bootstrap5 %}
{% load static %}
<!DOCTYPE html>
<html>
  <head>
    <!-- Enlaces a recursos que necesita la página -->
    {% bootstrap_css %}
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Michroma&display=swap" rel="stylesheet">
    <link href="{% static 'css/chatbot.css' %}" rel="stylesheet">
  </head>
  <body>
    <!-- Boton inicial para el widget -->
    <button id="chat-btn" class="btn btn-primary rounded-circle" onclick="abrir()">💬</button>

    <!-- Panel completo del chat -->
    <div id="chat-panel">
      <!-- Header del chat (Título del chat y boton de cerrar) -->
      <div id="chat-header" class="p-2 border-bottom d-flex justify-content-between">
        <strong>Asistente Virtual</strong>
        <button onclick="cerrar()" class="btn btn-sm">✕</button>
      </div>

      <!-- Historico de mensajes -->
      <div id="mensajes" class="flex-grow-1 p-2 overflow-auto">
        {% for mensaje in mensajes %}
          <!-- Lógica para presentar el mensaje en funcion del remitente -->
          {% if mensaje.remitente == "chatbot" %}
            <p class="msg-bot"> {{ mensaje.texto }} </p>
          {% else %}
            <p class="msg-user"> {{ mensaje.texto }} </p>
          {% endif %}
        {% endfor %}
      </div>

      <!-- Formulario del chat (Caja para insertar texto y botón de envío) -->
      <form id="form-chat" class="d-flex p-2 border-top">
        {% csrf_token %}
        <input id="input-msg" class="form-control me-2" placeholder="Escribe un mensaje" autocomplete="off" required>
        <button id="btn-enviar" class="btn btn-primary">Enviar</button>
      </form>

      <div id="escribiendo" class="msg-bot" style="display:none;">
        <span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span>
      </div>
    </div>

    <script>
      const formChat = document.getElementById('form-chat');
      const inputMsg = document.getElementById('input-msg');
      const btnEnviar = document.getElementById('btn-enviar');
      const mensajesDiv = document.getElementById('mensajes');
      const escribiendoDiv = document.getElementById('escribiendo');
      const csrftoken = document.querySelector('[name=csrfmiddlewaretoken]').value;

      formChat.addEventListener('submit', async function (e) {
        e.preventDefault();
        const texto = inputMsg.value.trim();
        if (!texto) return;

        mensajesDiv.insertAdjacentHTML('beforeend', `<p class="msg-user">${escaparHtml(texto)}</p>`);
        inputMsg.value = '';
        mensajesDiv.scrollTop = mensajesDiv.scrollHeight;

        btnEnviar.disabled = true;
        inputMsg.disabled = true;
        escribiendoDiv.style.display = 'flex';

        try {
          const resp = await fetch(window.location.pathname, {
            method: 'POST',
            headers: {
              'X-CSRFToken': csrftoken,
              'Content-Type': 'application/x-www-form-urlencoded',
            },
            body: `texto=${encodeURIComponent(texto)}&conversacion={{ conversacion.pk }}`,
          });
          const data = await resp.json();
          mensajesDiv.insertAdjacentHTML('beforeend', `<p class="msg-bot">${escaparHtml(data.bot)}</p>`);
        } catch (err) {
          mensajesDiv.insertAdjacentHTML('beforeend', `<p class="msg-bot">Ha habido un error, inténtalo de nuevo.</p>`);
        } finally {
          btnEnviar.disabled = false;
          inputMsg.disabled = false;
          escribiendoDiv.style.display = 'none';
          mensajesDiv.scrollTop = mensajesDiv.scrollHeight;
          inputMsg.focus();
        }
      });

      function escaparHtml(texto) {
        const div = document.createElement('div');
        div.textContent = texto;
        return div.innerHTML;
      }
    </script>

    <script>
      //Función que abre el panel del chat
      function abrir() {
        document.getElementById('chat-btn').style.display = 'none';
        const panel = document.getElementById('chat-panel');
        panel.style.display = 'flex';
        requestAnimationFrame(() => panel.classList.add('abierto'));
        window.parent.postMessage('chatbot:open', '*');
      }
      //Función que cierra el panel del chat y vuelve al botón
      function cerrar() {
        const panel = document.getElementById('chat-panel');
        panel.classList.remove('abierto');
        panel.addEventListener('transitionend', function ocultar() {
          panel.style.display = 'none';
          document.getElementById('chat-btn').style.display = 'flex';
          panel.removeEventListener('transitionend', ocultar);
        });
        window.parent.postMessage('chatbot:close', '*');
      }
    </script>
    {% bootstrap_javascript %}
  </body>
</html>
