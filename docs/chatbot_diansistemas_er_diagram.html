<style>
#erd svg.erDiagram .divider path { stroke-opacity: 0.5; }
#erd svg.erDiagram .row-rect-odd path,
#erd svg.erDiagram .row-rect-odd rect,
#erd svg.erDiagram .row-rect-even path,
#erd svg.erDiagram .row-rect-even rect { stroke: none !important; }
</style>
<div id="erd"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const themeMode = document.documentElement.dataset.mode;
const dark = themeMode ? themeMode === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"anthropic-sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"anthropic-sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
  },
});
const src = `erDiagram
  SERVICIO ||--o{ PEDIDO : servicio_pedido
  CONVERSACION ||--o{ MENSAJE : conversacion_mensajes
  CONVERSACION ||--o{ PEDIDO : conversacion_pedido
  CONVERSACION ||--o{ RESUMEN : resumenes
  MENSAJE ||--o| ANALISIS : mensaje_analisis
  ANALISIS ||--o{ ENTIDAD_DETECTADA : analisis_entidad
  ETIQUETA_ENTIDAD ||--o{ ENTIDAD_DETECTADA : etiqueta_entidad
  INTENCION ||--o{ ANALISIS : intencion_analisis
  INTENCION ||--o{ PAR_MENSAJE_RESPUESTA : intencion_par
  MENSAJE ||--o| PAR_MENSAJE_RESPUESTA : mensaje_usuario
  MENSAJE ||--o| PAR_MENSAJE_RESPUESTA : mensaje_chatbot
  PAR_MENSAJE_RESPUESTA ||--o{ EJEMPLO_LLM : ejemplo_llm
  MENSAJE ||--o{ EJEMPLO_NLP : mensaje_ejemploNLP
  INTENCION ||--o{ EJEMPLO_NLP : intencion_ejemploNLP
  EJEMPLO_NLP ||--o{ SPAN_ENTIDAD : spans
  ETIQUETA_ENTIDAD ||--o{ SPAN_ENTIDAD : etiqueta_spanEntidad

  SERVICIO {
    string nombre
    decimal coste
    int tiempo_aproximado
  }
  CONVERSACION {
    uuid token
    string estado
    string dominio
    bool tenemosCompra
  }
  MENSAJE {
    string remitente
    text texto
    datetime fecha_mensaje
  }
  PEDIDO {
    string nombre
    string direccion
    decimal presupuesto
    string forma_contacto
  }
  ANALISIS {
    float confianza
  }
  ENTIDAD_DETECTADA {
    string texto_detectado
    int inicio
    int fin
  }
  ETIQUETA_ENTIDAD {
    string nombre
  }
  INTENCION {
    string nombre
    bool activa
  }
  PAR_MENSAJE_RESPUESTA {
    text texto_usuario
    text texto_chatbot
  }
  EJEMPLO_LLM {
    string origen
  }
  EJEMPLO_NLP {
    text texto
    string origen
  }
  SPAN_ENTIDAD {
    int inicio
    int fin
  }
  RESUMEN {
    text texto
    string tipo
  }`;
const { svg } = await mermaid.render('erd-svg', src);
document.getElementById('erd').innerHTML = svg;

document.querySelectorAll('#erd svg.erDiagram .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});

document.querySelectorAll('#erd svg.erDiagram .row-rect-odd path, #erd svg.erDiagram .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
