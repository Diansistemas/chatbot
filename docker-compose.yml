# Shared by "web" and "setup": same image, same env, same volumes
x-app: &app
  build: .
  image: chatbot-app
  env_file: .env
  environment: &app-env
    OLLAMA_HOST: http://ollama:11434   # your code must use this, not localhost:11434
    SQLITE_PATH: /data/db.sqlite3
  volumes:
    - app_data:/data            # SQLite file + "data imported" marker
    # Modelo spaCy: volumen con nombre (entrenado en el contenedor) o, si
    # SPACY_MODEL_HOST_PATH apunta a una ruta en el host, esa carpeta
    - ${SPACY_MODEL_HOST_PATH:-spacy_model}:/app/entrenamiento/spacy/modelo

services:
  # 1) One-shot bootstrap: migrate -> import data -> train spaCy -> create Ollama models
  setup:
    <<: *app
    entrypoint: ["./setup.sh"]
    depends_on:
      ollama:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
        required: false           # ignored unless you start the "mysql" profile
    restart: "no"

  # 2) The actual app, only starts once setup finished successfully
  web:
    <<: *app
    environment:
      <<: *app-env
      RUN_COLLECTSTATIC: "1"
    ports:
      - "${WEB_PORT:-8000}:8000"
    depends_on:
      setup:
        condition: service_completed_successfully
      ollama:
        condition: service_healthy
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama # downloaded models persist here
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    # NVIDIA GPU (optional): uncomment
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # One-shot job: downloads llama3.2 the first time, instant afterwards
  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "${OLLAMA_MODEL_RESUMEN:-llama3.2}"]
    restart: "no"

  # Future: docker compose --profile mysql up -d
  db:
    image: mysql:8.4
    profiles: ["mysql"]
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  app_data:
  spacy_model:
  ollama_data:
  mysql_data: